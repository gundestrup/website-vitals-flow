<!doctype html><html data-theme="light"><head><meta charset=utf-8><title>website-vitals-flow</title>
<link rel=stylesheet href=/vendor/bulma.min.css><link rel=stylesheet href=/style.css></head>
<body><section class=section><div class="container" style="max-width:1120px">
<p class=eyebrow>website-vitals-flow</p>
<h1 class="title is-4 section-heading">Monitored sites</h1>
<div x-data="dash" x-init="load()">
<div x-show="!sel">
<template x-if="jobs.length"><div class="box is-shadowless" style="border:1px solid var(--wvf-line);padding:.7em">
  <template x-for="j in jobs.slice(0,4)"><div class="job-row mono" x-text="j.state+': '+(j.detail||'')"></div></template>
</div></template>
<div class=table-container><table class="table is-fullwidth is-hoverable"><thead>
<tr><th>site</th><th>schedule</th><th>last TTFB</th><th>last LCP</th><th>last CLS</th><th></th></tr></thead>
<tbody><template x-for="s in sites"><tr>
  <td><a href="#" @click.prevent="open(s.key)" x-text="s.label||s.key"></a>
      <span class="tag is-light" x-show="s.deep">deep</span>
      <span class="tag is-light" x-show="s.only" x-text="s.only"></span></td>
  <td class=mono x-text="s.schedule||'manual'"></td>
  <td><template x-if="last[s.key]"><span>
      <img class=badge-img x-bind:src="'/badges/ttfb-'+bandName('ttfb',last[s.key].ttfb_ms)+'.svg'">
      <span class="badge-val mono" x-text="fmtv('ttfb',last[s.key].ttfb_ms)"></span></span></template></td>
  <td><template x-if="last[s.key]"><span>
      <img class=badge-img x-bind:src="'/badges/lcp-'+bandName('lcp',last[s.key].lcp_ms)+'.svg'">
      <span class="badge-val mono" x-text="fmtv('lcp',last[s.key].lcp_ms)"></span></span></template></td>
  <td><template x-if="last[s.key]"><span>
      <img class=badge-img x-bind:src="'/badges/cls-'+bandName('cls',last[s.key].cls)+'.svg'">
      <span class="badge-val mono" x-text="fmtv('cls',last[s.key].cls)"></span></span></template></td>
  <td><button class="button is-small is-primary" @click="scan(s.key)" x-bind:disabled="busy">scan now</button></td>
</tr></template></tbody></table></div></div>
<div x-show="sel" style="margin-top:1em">
  <a href="#" @click.prevent="sel='';location.hash=''" class="mono" style="font-size:.8rem">← all sites</a>
  <p class=eyebrow x-text="sel"></p>
  <template x-if="last[sel]"><div class="metric-grid">
    <template x-for="m in metricCards()"><div class="metric-cell">
      <img class=badge-img x-bind:src="'/badges/'+m.id+'-'+m.band+'.svg'" x-show="m.band!=='na'">
      <div class="metric-val mono" x-text="m.text"></div>
      <div class="metric-lbl" x-text="m.label"></div>
    </div></template>
  </div></template>
  <h2 class="title is-5 section-heading">Trend — timings</h2>
  <div class="box is-shadowless" style="border:1px solid var(--wvf-line)"><canvas id=chart></canvas></div>
  <h2 class="title is-5 section-heading">Trend — layout shift</h2>
  <div class="box is-shadowless" style="border:1px solid var(--wvf-line)"><canvas id=chart2></canvas></div>
  <h2 class="title is-5 section-heading" x-show="findings.length">Findings</h2>
  <template x-for="f in findings"><div class="job-row" style="padding:.4em 0">
    <span x-bind:class="'sev-'+f.severity" x-text="'['+f.severity+']'"></span>
    <span x-text="f.title"></span>
    <a x-show="f.link" x-bind:href="f.link" target="_blank" rel="noopener" x-text="'→ guide'"></a>
  </div></template>
  <h2 class="title is-5 section-heading">Runs</h2>
  <div class=table-container><table class="table is-fullwidth"><thead>
  <tr><th>id</th><th>when</th><th>engine</th><th>ttfb</th><th>lcp</th><th>cls</th><th>tbt</th><th>proto</th></tr></thead>
  <tbody><template x-for="r in runs"><tr>
    <td class=mono x-text="r.id"></td><td class=mono x-text="r.started_at.slice(0,16).replace('T',' ')"></td>
    <td class=mono x-text="r.engine"></td><td class=mono x-text="fmt(r.ttfb_ms)"></td>
    <td class=mono x-text="fmt(r.lcp_ms)"></td><td class=mono x-text="r.cls.toFixed(3)"></td>
    <td class=mono x-text="fmt(r.tbt_ms)"></td><td><span class="tag is-light mono" x-text="r.http_protocol"></span></td>
  </tr></template></tbody></table></div></div>
</div></div></section>
<script src=/vendor/chart.umd.js></script><script src=/vendor/cdn.min.js defer></script>
<script src=/app.js></script></body></html>
