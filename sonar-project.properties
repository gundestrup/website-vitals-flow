# SonarQube Cloud configuration.
#
# One-time service-side setup (cannot be done from the repo):
#   1. Import gundestrup/website-vitals-flow at https://sonarcloud.io
#      and confirm the organization/project key below.
#   2. Add SONAR_TOKEN to the GitHub repository secrets.
#   3. Keep Automatic Analysis disabled for the project (Administration ->
#      Analysis Method) — SonarCloud rejects CI-based scanner uploads while
#      it is enabled, and the CI `sonar` job fails with exit code 3.
# The CI `sonar` job self-skips while the token is absent.
#
# Imports the report already produced by the toolchain:
#   - Go cover profile -> sonar.go.coverage.reportPaths (coverage-ci / CI)

sonar.organization=gundestrup
sonar.projectKey=gundestrup_website-vitals-flow
sonar.projectName=website-vitals-flow

sonar.sources=cmd,internal,scripts
sonar.test.inclusions=**/*_test.go

# Vendored third-party UI assets, release binaries, generated reports and
# scratch dirs are operator artifacts — not source to be analyzed.
sonar.exclusions=internal/server/static/vendor/**,dist/**,report/**,static-tmp/**,node_modules/**,coverage.out,test-report.json

sonar.go.coverage.reportPaths=coverage.out
